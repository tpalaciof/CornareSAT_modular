<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Datos</title>
</head>
<body>

    <h1>Formulario de Datos</h1>

    <!-- Formulario con campos de texto y checkboxes -->
    <form id="myForm">
        <!-- Campos de texto -->
        <label for="CODE">Código:</label>
        <input type="text" id="CODE" name="CODE" required><br><br>

        <label for="NAME">Nombre:</label>
        <input type="text" id="NAME" name="NAME" required><br><br>

        <label for="MUNICIPIO">Municipio:</label>
        <input type="text" id="MUNICIPIO" name="MUNICIPIO" required><br><br>

        <!-- Checkboxes -->
        <label>
            <input type="checkbox" id="MAXBOTIX_TTL" name="MAXBOTIX_TTL" value="true"> MAXBOTIX TTL
        </label><br>

        <label>
            <input type="checkbox" id="RAIN" name="RAIN" value="true"> Lluvia
        </label><br><br>

        <!-- Campo de tiempo (Sample Time) -->
        <label for="SAMPLETIME_LEVEL">Sample Time Level:</label>
        <input type="number" id="SAMPLETIME_LEVEL" name="SAMPLETIME_LEVEL" required><br><br>

        <label for="SAMPLETIME_RAIN">Sample Time Rain:</label>
        <input type="number" id="SAMPLETIME_RAIN" name="SAMPLETIME_RAIN" required><br><br>

        <label for="SAMPLETIME_MONITORING">Sample Time Monitoring:</label>
        <input type="number" id="SAMPLETIME_MONITORING" name="SAMPLETIME_MONITORING" required><br><br>

        <!-- Botones -->
        <button type="submit">Enviar</button>
        <button type="button" id="reiniciarBtn">Reiniciar</button>
    </form>

    <p id="responseMessage"></p>

    <script>
        document.getElementById('myForm').addEventListener('submit', function(event) {
            event.preventDefault();  // Prevenir el comportamiento por defecto del formulario

            // Crear un FormData del formulario
            const form = document.getElementById('myForm');
            const formData = new FormData(form);

            // Crear el objeto JSON con los datos del formulario
            let data = {
                CODE: formData.get('CODE'),  // Capturar el valor del código
                NAME: formData.get('NAME'),  // Capturar el valor del nombre
                MUNICIPIO: formData.get('MUNICIPIO'),  // Capturar el valor del municipio
                MAXBOTIX_TTL: formData.has('MAXBOTIX_TTL'),  // true si está marcado, false si no
                SAMPLETIME_LEVEL: parseInt(formData.get('SAMPLETIME_LEVEL'), 10),  // Capturar el valor de sampletime
                RAIN: formData.has('RAIN'),  // true si está marcado, false si no
                SAMPLETIME_RAIN: parseInt(formData.get('SAMPLETIME_RAIN'), 10),  // Capturar el valor de sampletime rain
                SAMPLETIME_MONITORING: parseInt(formData.get('SAMPLETIME_MONITORING'), 10)  // Capturar el valor de sampletime monitoring
            };

            console.log("Datos a enviar:", JSON.stringify(data));  // Ver los datos en consola

            // Realizar la solicitud fetch para enviar los datos
            fetch('/api/datos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)  // Enviar el objeto JSON
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('responseMessage').textContent = data.mensaje || data.error;
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });

        // Funcionalidad para el botón de reiniciar
        document.getElementById('reiniciarBtn').addEventListener('click', function() {
            fetch('/api/reboot', {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('responseMessage').textContent = data.mensaje || data.error;
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>

</body>
</html>
